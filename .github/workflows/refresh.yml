name: Refresh ZeroLive playlist
on:
  # GitHub cron uses UTC. Philippine Standard Time (Asia/Manila) = UTC+8.
  # 00:00, 04:00, 06:00, 07:00, 08:00, 10:00, 12:00, 15:00, 18:00, 21:00 PHT.
  schedule:
    - cron: '0 0,2,4,7,10,13,16,20,22,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zerolive-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test scraper
        run: python -m unittest discover -s tests -v
      - name: Discover and verify HLS streams
        run: python -m zerolive
      - name: Commit updated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified ZeroLive streams'
            git push
          fi
