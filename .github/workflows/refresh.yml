name: Refresh ZeroLive playlist
on:
  push:
    branches: [main]
    paths:
      - 'zerolive/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zerolive-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test scraper
        run: python -m unittest discover -s tests -v
      - name: Discover and verify HLS streams
        run: python -m zerolive
      - name: Commit updated playlist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist.m3u data/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh verified ZeroLive streams'
            git push
          fi
